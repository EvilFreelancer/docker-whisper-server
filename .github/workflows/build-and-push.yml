name: Check for new releases, build and push containers
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "whisper.cpp tags to build and push, space separated (rebuilt even if already published); empty: the missing ones of the last five releases"
        required: false
        default: ""
  schedule:
    - cron: '0 0 * * *' # every day at midnight

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      owner: evilfreelancer
      repo: whisper-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The Intel image unpacks to ~19 GB on top of the oneAPI base; the stock runner
      # has ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pick versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.versions }}
        run: |
          if [ -n "$REQUESTED" ]; then
            list="$REQUESTED"
          else
            published=$(curl -s "https://registry.hub.docker.com/v2/repositories/${owner}/${repo}/tags/?page_size=100" \
              | jq -r '.results[].name' | grep -vE '^(latest|cuda|intel)$' | sed -E 's/-(cuda|intel)$//' | sort -u)
            releases=$(gh api repos/ggerganov/whisper.cpp/releases --jq '.[].tag_name' | sort -V | tail -n 5)
            list=""
            for tag in $releases; do
              grep -qx "$tag" <<< "$published" || list="$list $tag"
            done
          fi
          list=$(echo $list | tr ' ' '\n' | sort -V | tr '\n' ' ')
          echo "To build: ${list:-nothing}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.versions.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker buildx create --name my_builder --driver=docker-container --use
          newest=""
          for tag in ${{ steps.versions.outputs.list }}; do
            echo "::group::$tag cuda"
            docker buildx build --builder=my_builder --push --platform=linux/amd64 \
              --build-arg WHISPER_VERSION=${tag} \
              --tag=${owner}/${repo}:${tag} --tag=${owner}/${repo}:${tag}-cuda ./whisper/
            docker buildx prune --builder=my_builder -af >/dev/null
            echo "::endgroup::"
            echo "::group::$tag intel"
            docker buildx build --builder=my_builder --push --platform=linux/amd64 \
              --file ./whisper/Dockerfile.intel --build-arg WHISPER_VERSION=${tag} \
              --tag=${owner}/${repo}:${tag}-intel ./whisper/
            docker buildx prune --builder=my_builder -af >/dev/null
            echo "::endgroup::"
            newest=$tag
          done

          # latest, cuda and intel follow the newest whisper.cpp release when this run built
          # it, without a second build: the manifests are copied on the registry.
          top=$(gh api repos/ggerganov/whisper.cpp/releases --jq '.[].tag_name' | sort -V | tail -n 1)
          if [ "$newest" = "$top" ]; then
            echo "Tagging $newest as latest, cuda and intel"
            docker buildx imagetools create -t ${owner}/${repo}:latest -t ${owner}/${repo}:cuda ${owner}/${repo}:${newest}-cuda
            docker buildx imagetools create -t ${owner}/${repo}:intel ${owner}/${repo}:${newest}-intel
          else
            echo "Newest built is $newest, the newest release is $top: latest stays where it is"
          fi
